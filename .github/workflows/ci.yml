name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # advisories of the published dependencies, ignored ones are in pnpm-workspace.yaml
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - run: pnpm audit --prod
        shell: bash

  # advisories of every dependency, dev ones included, ignored ones are in osv-scanner.toml
  osv_scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            scan
            source
            -L
            pnpm-lock.yaml
